{% extends "nav.html" %}
    
{% block content %}

<style>
   /* Custom Dark Card Styling */
        .custom-card {
            background-color: #1e222b;
            color: white;
            border: 1px solid #313745;
        }
        .custom-card1 {
            background-color: #1e222b;
            color: #DCDCDC;
            border: 1px solid #3d4457;
        }

         body {
            background-color: #121212;
            color: white;
        }
</style>

<div class = "container card rounded-4 p-4 mb-4 custom-card">
    <h3 class="text-center">Filter Employee Details</h3>
</div>
    

    <div class="container card rounded-4 p-4 mb-4 custom-card ">
    <form class="row g-3 needs-validation" novalidate action="/filter_emp" method="POST">
      {% csrf_token %}
  <div class="col-md-4">
    <label for="name" class="form-label">First/Last Name</label>
    <input type="text" class="form-control custom-card1" name="name" id="name" value="{{ name }}" required>
    
  </div>
  <div class="col-md-4">
    <label for="dept" class="form-label">Department</label>
    <input type="text" class="form-control custom-card1" id="dept" name="dept" value="{{ dept }}" required>
    
  </div>
  <div class="col-md-4">
    <label for="role" class="form-label">Role</label>
      <input type="text" class="form-control custom-card1" id="role" name="role" value="{{ role }}" required>
    </div>

    <div class="col-12">
    <button class="btn btn-primary" type="submit">Submit form</button>
  </div>

  </div>
{% endblock  %}
