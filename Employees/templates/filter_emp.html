<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employees Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class = "container">
    <h1>Filter Employee Details</h1>
    <hr>
    <a class="btn btn-primary" href="/view_all" role="button">View Emp</a>
    <a class="btn btn-primary" href="/add_emp" role="button">Add emp</a>
    <a class="btn btn-primary" href="/index" role="button">Home</a>
    <a class="btn btn-primary" href="/remove_emp" role="button">Remove emp</a>
    </div> 

    <div class="container ">
    <form class="row g-3 needs-validation" novalidate action="/filter_emp" method="POST">
      {% csrf_token %}
  <div class="col-md-4">
    <label for="name" class="form-label">First/Last Name</label>
    <input type="text" class="form-control" name="name" id="name" value="{{ name }}" required>
    
  </div>
  <div class="col-md-4">
    <label for="dept" class="form-label">Department</label>
    <input type="text" class="form-control" id="dept" name="dept" value="{{ dept }}" required>
    
  </div>
  <div class="col-md-4">
    <label for="role" class="form-label">Role</label>
      <input type="text" class="form-control" id="role" name="role" value="{{ role }}" required>
    </div>

    <div class="col-12">
    <button class="btn btn-primary" type="submit">Submit form</button>
  </div>

  </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
