<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sidebar ko poori height dene ke liye */
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
        }
        .sidebar a {
            color: #cfd4da;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .sidebar a:hover {
            background-color: #1E90FF;
            color: #fff;
        }

        
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar Section (Left Side) -->
            <div class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="text-white mb-4">🤵🏻EMS Panel</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="/admin">📊 Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="/index">🏠 Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="/add_emp">➕ Add Employee</a>
                    </li>
                    <li class="nav-item">
                        <a href="/view_all">📋 View Employees</a>
                    </li>
                    <li class="nav-item">
                        <a href="/filter_emp">🔍 Filter Employee</a>
                    </li>
                </ul>
            </div>

            <!-- Main Content Section (Right Side) -->
            <div class="col-md-9 col-lg-10 ">
                
                <p>   {% block content %}
                    {% endblock  %}</p>
                
                <!-- Aapka baaki content ya blocks yahan aayenge -->
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
