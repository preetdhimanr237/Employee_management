<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sidebar ko poori height dene ke liye */
        .sidebar {
            min-height: 100vh;
            background-color: #1e222b;
        }
        .sidebar a {
            color: #cfd4da;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .sidebar a:hover {
            background-color: #1E90FF;
            color: #fff;
        }

        
    </style>
</head>
<body>

   <!-- 📱 Mobile ke liye Toggle Button (Sirf mobile par dikhega) -->
<div class="d-md-none bg-dark p-3 text-end">
    <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#mySidebar">
        ☰ Menu
    </button>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- 🧭 Sidebar (Mobile par collapse/hide rahegi, button dabane par khulegi; Laptop par hamesha dikhegi) -->
        <div class="col-md-3 col-lg-2 sidebar p-3 collapse d-md-block" id="mySidebar" style="background-color: #1e222b; min-height: 100vh;">
            <h4 class="text-white mb-4 ps-2">👩🏻‍💼 EMS Panel</h4>
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a href="/admin" class="text-white text-decoration-none d-block p-2 rounded"> ⏲ Admin Dashboard</a></li>
                <li class="nav-item mb-2"><a href="/index" class="text-white text-decoration-none d-block p-2 rounded">🏠 Home</a></li>
                <li class="nav-item mb-2"><a href="/add_emp" class="text-white text-decoration-none d-block p-2 rounded">➕ Add Employee</a></li>
                <li class="nav-item mb-2"><a href="/view_all" class="text-white text-decoration-none d-block p-2 rounded">📋 View Employees</a></li>
                <li class="nav-item mb-2"><a href="/filter_emp" class="text-white text-decoration-none d-block p-2 rounded">🔍 Filter Employee</a></li>
                <li class="nav-item mb-2"><a href="/remove_emp" class="text-white text-decoration-none d-block p-2 rounded">🗑️ Remove Employee</a></li>
            </ul>
        </div>

        <!-- 💻 Main Content -->
        <div class="col-12 col-md-9 col-lg-10 p-4">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
