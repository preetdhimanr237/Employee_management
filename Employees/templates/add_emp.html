<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employees Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class = "container">
    <h1>Add Employee Details</h1>
    <hr>
    <a class="btn btn-primary" href="/view_all" role="button">View Emp</a>
    <a class="btn btn-primary" href="/index" role="button">Home</a>
    <a class="btn btn-primary" href="/filter_emp" role="button">Filter emp</a>
    <a class="btn btn-primary" href="/remove_emp" role="button">Remove emp</a>
    <hr>
    </div> 
<div class="container ">
    <form class="row g-3 needs-validation" novalidate action="/add_emp" method="POST">
      {% csrf_token %}
  <div class="col-md-4">
    <label for="first_name" class="form-label">First name</label>
    <input type="text" class="form-control" name="first_name" id="first_name" value="{{ first_name }}" required>
    
  </div>
  <div class="col-md-4">
    <label for="text" class="form-label">Last name</label>
    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ last_name}}" required>
    
  </div>
  <div class="col-md-4">
    <label for="salary" class="form-label">Salary</label>
      <input type="number" class="form-control" id="salary" name="salary" value="{{ salary}}" required>
    </div>
 
    <div class="col-md-4">
    <label for="phone" class="form-label">Phone</label>
      <input type="number" class="form-control" id="Phone" name="phone" value="{{ phone }}" required>
    </div>
 
    <div class="col-md-4">
    <label for="dept" class="form-label">Department</label>
      <input type="text" class="form-control" id="salary" name="dept" value="{{ dept }}" required>
    </div>
 
    <div class="col-md-4">
    <label for="role" class="form-label">Role</label>
      <input type="text" class="form-control" id="role" name="role" value="{{ role }}" required>
    </div>

    <div class="col-md-4">
    <label for="location" class="form-label">Location</label>
      <input type="text" class="form-control" id="location" name="location" value="{{ role }}" required>
    </div>

    <div class="col-md-4">
    <label for="bonus" class="form-label">Bonus</label>
      <input type="number" class="form-control" id="bonus" name="bonus" value="{{ bonus }}" required>
    </div>

    <div class="col-12">
    <button class="btn btn-primary" type="submit">Submit form</button>
  </div>
      
  </div>
  
  
</form>
</div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
